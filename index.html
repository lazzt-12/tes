<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Sistem Data Pegawai</title>
</head>
<body>
    <h2>FORMULIR INPUT DATA PEGAWAI</h2>
    <form action="/simpan" method="POST">
        <label>Nama Pegawai:</label><br>
        <input type="text" name="nama_pegawai" required><br><br>

        <label>Umur:</label><br>
        <input type="number" name="umur_pegawai" required><br><br>

        <button type="submit">Simpan Data</button>
    </form>
</body>
</html>
