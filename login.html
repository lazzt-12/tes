<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <title>Halaman login</title>
        <style>
            body {
                font-family: Arial, Helvetica, sans-serif;
                background-color: blanchedalmond;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                height: 100vh;
                margin: 0;

            }
            .login-card {
                background-color: white;
                padding: 30px;
                border-radius: 8px;
                box-shadow: 0 4px 8px rgba(0,0,0,0.1);
                width: 300px;
            }
            .login-card h2 {
                text-align: center;
                color: #333;
            }
            .form-grup {
              margin-bottom: 15px;  
            }
            .form-grup label{
                display: block;
                margin-bottom: 5px;
                color: #666
            }
            .form-grup input {
                width: 100%;
                padding: 10px;
                border: 1px solid #ccc;
                border-radius: 4px;
                box-sizing: border-box;
            }
            .btn-login {
                width: 100%;
                padding: 10px;
                background-color: #007bff;
                color: white;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                font-size: 16px;
            }
            .btn-login :hover {
                background-color: #0056b3;
            }
        </style>
    </head>
    <body>
        <div class="login-card">
            <h2 style="color: #333;"> INPUT DATA KEPEGAWAIAN</h2>
            <small style="font-size: smaller; color: #333; display: block; margin-bottom: 30px; text-align: center;">
                Selamat datang kembali! silahkan melakukan login untuk masuk ke akun anda 
            </small>
            <form action="/proses-login" method="POST">
                <div class="form-grup">
                    <label>Username</label>
                    <input type="text" name="usernameInput" required>
                </div>
                <div class="form-grup">
                    <label>password</label>
                    <input type="password" name="passwordInput" required>
                    
                </div>
                <button type="submit" class="btn-login">login</button>
                <small style="font-size: smaller; color: #666; display: block; margin-top: 10px; text-align: center;">
                    Butuh Bantuan? Silahkan chat admin
                </small>
                <small style="font-size: smaller; color: #666; display: block; margin-top: 10px; text-align: center;"> lupa sandi?
                    <a href="/lupa-pass" style="font-size: 14px; color: #007bff; text-decoration: none;">
                    Ganti sandi
                    </a>
                </small>
            </form>
            
        </div>
        <small style="font-size: smaller; color: #666; display: block; margin-top: 6px; ">
                Pastikan huruf kapital saat pengisian sesuai agar tidak yerjadi eror saat login.
            </small>
    </body>
</html>
