<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <title>Lupa password</title>
        <style>
             body {
                font-family: Arial, Helvetica, sans-serif;
                background-color: blanchedalmond;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                height: 100vh;
                margin: 0;

            }
            .lupaPass-card {
                background-color: white;
                padding: 30px;
                border-radius: 8px;
                box-shadow: 0 4px 8px rgba(0,0,0,0.1);
                width: 300px;
            }
            .lupaPass-card h2 {
                text-align: center;
                color: #333;
            }
            .form-grup {
              margin-bottom: 15px;  
            }
            .form-grup label{
                display: block;
                margin-bottom: 5px;
                color: #666
            }
            .form-grup input {
                width: 100%;
                padding: 10px;
                border: 1px solid #ccc;
                border-radius: 4px;
                box-sizing: border-box;
            }
            .btn-ubahPass {
                width: 100%;
                padding: 10px;
                background-color: #007bff;
                color: white;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                font-size: 16px;
            }
            .btn-ubahPass :hover {
                background-color: #0056b3;
            }
        </style>
    </head>
    <body>
        <div class="lupaPass-card">
            <h2 style="color: #333;"> ATUR ULANG KATA SANDI </h2>
            <small style="font-size: smaller; color: #333; display: block; margin-bottom: 30px; text-align: center;">
                Masukan Username terdaftar dan buat password terbaru anda.
            </small>
            <form action="/lupa-pass" method="post">
                <div class="form-grup">
                    <label>Username</label>
                    <input type="text" name="usernameInput" required>
                </div>
                <div class="form-grup">
                    <label>Sandi terbaru</label>
                    <input type="password" name="newPasswordInput" required>
                </div>
                <button type="submit" class="btn-ubahPass">Ubah Sandi</button>
                <div style="text-align: center; margin-top: 20px;">
                    <a href="/" style="font-size: 14px; color: #007bff; text-decoration: none;">
                        Kembali ke halaman login
                    </a>
                </div>
            </form>
        </div>
    </body>
</html>
