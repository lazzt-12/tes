<!DOCTYPE html>
<html lang = "id">
<head>
    <meta charset="UTF-8">
    <title>DASHBOARD DATA PEGAWAI</title>
    <style>
        body {font-family: Arial, sans-serif; background-color: blanchedalmond; padding: 20px; margin: 0;}
        .header {display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;}
        .btn-logout {background-color: red; color: white; padding: 10px 15px; text-decoration: solid; border-radius: 4px; font-weight: bold;}
        .container {display: flex; gap: 20px; align-items: flex-start;}
        .card {background-color: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);}
        .kolom-form {flex: 1;}
        .kolom-data {flex: 2; overflow-x: auto;}
        .form-grup {margin-bottom: 15px;}
        .form-grup label {display: block; margin-bottom: 5px; color: #333; font-weight: bold;}
        .form-grup input {width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;}
        .btn-simpan {width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px;}
        .btn-simpan :hover {background-color: #0056b3;}

        table{width: 100%; border-collapse: collapse;}
        th, td {border: 1px solid #ddd; padding: 12px; text-align: left;}
        th {background-color: #007bff; color: white;}
        tr:nth-child(even) {background-color: #f9f9f9;} 
    </style>
</head>

<body>
    <div class="header">
        <h2 style="color: #333; margin: 0;">DASHBOARD DATA KEPEGAWAIAN</h2>
        <a href="/" class="btn-logout">logout</a> 
    </div>
    <div class="container">
        <div class="card kolom-form">
            <h3 style="margin-top: 0;">tambah pegawai baru</h3>
            <form action="/simpan" method="post">
                <div class="form-grup">
                    <label>NIP pegawai</label>
                    <input type ="number" name="nip_pegawai" required>
                </div>
                <div class="form-grup">
                    <label>NAMA Pegawai</label>
                    <input type="text" name="nama_pegawai" required>
                </div>
                <div class="form-grup">
                    <label>Umur</label>
                    <input type ="number" name="umur_pegawai" required>
                </div>
                <div class="form-grup">
                    <label>Nomor pegawai</label>
                    <input type="nomor" name="no_telepon" required>
                </div>
                <div class="form-grup">
                    <label>Email Pegawai</label>
                    <input type="email" name="email_pegawai" required>
                </div>
                <button type="submit" class="btn-simpan">SIMPAN DATA</button>
            </form>
        </div>

        <div class="card kolom-data">
            <h3 style="margin-top: 0;">DAFTAR PEGAWAI TERDAFTAR</h3>
            <table>
                <thead>
                    <tr>
                        <th>NIP</th>
                        <th>Nama Pegawai</th>
                        <th>Umur</th>
                        <th>No. telepon</th>
                        <th>Email</th>
                    </tr>
                </thead>
                <tbody  id="wadah-table">
                    <tr><td colspan="5">sedang memuat data base...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <script>
        fetch('/api/data-pegawai')
            .then(respon => respon.json())
            .then(dataPegawai => {
                const wadah = document.getElementById('wadah-table');
                wadah.innerHTML = "";

                dataPegawai.forEach(pegawai => {
                    wadah.innerHTML += `
                        <tr>
                            <td>${pegawai.nip}</td>
                            <td>${pegawai.nama}</td>
                            <td>${pegawai.umur}</td>
                            <td>${pegawai.nomor}</td>
                            <td>${pegawai.email}</td>
                        </tr>
                    `;
                });
            })
            .catch(error => {
                document.getElementById('wadah-tabel').innerHTML = "<tr><td colspan='5'>Gagal memuat data</td></tr>";
            })
    </script>
    
</body>
</html>
