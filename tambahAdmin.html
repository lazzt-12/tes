<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <title>HALAMAN INPUT ADMIN</title>
        <style>
            body {font-family: Arial, Helvetica, sans-serif; background-color: blanchedalmond; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;}
            .card-admin {background-color: white;padding: 40px; border-radius: 6px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); width: 400px;}
            h2 {color: #6f42c1; margin-top: 0; text-align: center;}
            .form-grup {margin-bottom: 20px;}
            .form-grup label {display: block; margin-bottom: 8px; color: #333; font-weight: bold;}
            .form-grup input {width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;} 
            .btn-simpan-admin {width: 100%; padding: 14px; background-color: #6f42c1; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; margin-bottom: 15px;}
            .btn-simpan-admin :hover { background-color: #59339d;}
            .btn-kembali {display: block; text-align: center; color: #6c757d; text-decoration: none; font-weight: bold;}
            .btn-kembali :hover {color: #343a40;}
        </style>
    </head>
    <body>
        <div class="card-admin">
            <h2>Buat Akun Admin</h2>
            <p style="text-align: center; color: #666; margin-bottom: 30px;">Area ini hanya untuk admin silahkan gunakan form ini untuk memberikan akses login ke pegawai yang berwenang</p>

            <form action="/kelola-admin" method="post">
                <div class="form-grup">
                    <label>Username</label>
                    <input type="text" name="username_baru" placeholder="contoh: admin_rizky" required>
                </div>
                <div class="form-grup">
                    <label>password</label>
                    <input type="password" name="password_baru" placeholder="masukan password" required>
                </div>
                <button type="submit" class="btn-simpan-admin">buat akun baru</button>
            </form>

            <a href="/dashboard" class="btn-kembali">KEMBALI KE DASHBOARD</a>
        </div>
    </body>
</html>
